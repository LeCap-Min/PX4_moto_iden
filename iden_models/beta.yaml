# beta 舵机：指令角 → 总线回传角 的闭环二阶模型（100 Hz 发令）
# 输入 / 输出：度。fn/ζ/延迟由 log6（通道 5，F1=60，扫到 38 Hz）实测拟合；
# 再用 log18（通道 7）、log0/3/4（通道 5）复核。只用 8° 扫频 Bode。
# 注意：±15° 阶跃完全撞到 600 °/s 速率限制（线性模型需 1137 °/s），
# 阶跃的 25 ms 上升是 Vmax 决定的，不能反推 fn/ζ。

name: beta
type: bus_servo
channels: [5, 7]
logs:
  - log_6_2026-8-27-23-18-26.ulg      # 主拟合，扫到 38 Hz
  - log_18_2026-8-27-20-33-58.ulg     # 复核（30 Hz 截断）
  - log_0_2026-8-27-20-49-42.ulg
  - log_3_2026-8-27-21-24-36.ulg
  - log_4_2026-8-27-22-02-04.ulg
iden_sv_hz: 100

gain_K: 0.97
fn_hz: 24.5
zeta: 0.58
wn_rad: 153.94
num: [22986.4]         # K * wn^2
den: [1.0, 178.57, 23697.3]

# 延迟记法（二者只选一个）：
# delay_total_s：100 Hz 控制器实际看到的总延迟，含 100 Hz 零阶保持的半拍 5 ms。
# delay_plant_s：仿真自己已做 100 Hz 零阶保持再进连续模型时用（总延迟 - 5 ms）。
delay_total_s: 0.0157
delay_plant_s: 0.0107

# 100 Hz 精确 ZOH 离散等效（含 0.7 ms 分数延迟），按 z^-k 排列
discrete_100hz:
  b: [0, 0, 0.526823, 0.357371, 0.000984]
  a: [1, -0.255129, 0.167683]

# 有效频段与误差：≤19 Hz 内 log18/0/3/6 |误差| ≤ 0.6 dB / 2.2° rms；log6 到 26 Hz 内 ≤0.35 dB / 2.2°。
# log4（飞控绑臂上、陀螺回传）偏差最大：1.6 dB / 7.4°。
valid_to_hz: 26

# 外环一阶等效（按 −45° 点）：交叉建议 1.2–1.8 Hz
first_order_tau_s: 0.030

model_crossings:
  mag_3db_hz: 28.7
  phase_45_hz: 5.3
  phase_90_hz: 10.4

measured:
  dc_gain: 0.968-0.974
  mag_3db_hz: 29.9        # log6 实测
  phase_45_hz: 5.2-5.3
  phase_90_hz: 9.9-10.5
  mag_peak_db: 0.2-0.3
  vmax_dps: 600
  step_rise_10_90_ms: 24-27 # 速率限制决定
  half_amp_dc_gain: 0.92    # 4° 扫频，对应约 0.2° 死区/回差

# 200 Hz 发令（log13/log5）时：−45° 6.1–7.2 Hz，总延迟约 10 ms。换发令频率要重测。
