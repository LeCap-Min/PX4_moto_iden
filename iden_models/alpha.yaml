# alpha 舵机：指令角 → 总线回传角 的闭环二阶模型（100 Hz 发令）
# 输入 / 输出：度。四份完整扫频日志（log15/16/17 通道 3，log2 通道 1）合并拟合，只用 8° 扫频 Bode。
# 注意：±15° 阶跃受速率/加速度整形影响（线性模型需 466 °/s，已达 Vmax 555 的 84%），
# 实测超调 4.7~5.3% 远小于线性的 14.8%，阶跃超调不能反推 ζ；旧版 fn=11.5/ζ=0.70 就是这么错的。

name: alpha
type: bus_servo
channels: [1, 3]
logs:
  - log_15_2026-8-27-17-52-24.ulg
  - log_16_2026-8-27-19-43-24.ulg
  - log_17_2026-8-27-20-17-34.ulg
  - log_2_2026-8-27-21-16-40.ulg
iden_sv_hz: 100

gain_K: 0.97
fn_hz: 9.5
zeta: 0.52
wn_rad: 59.69
num: [3456.3]          # K * wn^2
den: [1.0, 62.08, 3563.2]

# 延迟记法（二者只选一个）：
# delay_total_s：100 Hz 控制器实际看到的总延迟，含 100 Hz 零阶保持的半拍 5 ms。
#   仿真中若把 100 Hz 指令序列直接当连续信号（或用 c2d 后比对实测 Bode），用这个。
# delay_plant_s：仿真自己已做 100 Hz 零阶保持再进连续模型时，连续模型用这个（总延迟 - 5 ms）。
delay_total_s: 0.009
delay_plant_s: 0.004

# 100 Hz 精确 ZOH 离散等效（含 4 ms 分数延迟），按 z^-k 排列
discrete_100hz:
  b: [0, 0.054582, 0.179289, 0.016094]
  a: [1, -1.279830, 0.537526]

# 有效频段与误差：≤10 Hz 内 |误差| ≤ 0.8 dB / 13°；11 Hz 以上实测比二阶掉得更陡，模型到 12 Hz 为止。
valid_to_hz: 12

# 外环一阶等效（按 −45° 点）：交叉建议 1.0–1.6 Hz
first_order_tau_s: 0.037

model_crossings:
  mag_3db_hz: 11.9
  phase_45_hz: 4.3
  phase_90_hz: 7.5

measured:
  dc_gain: 0.974-0.979
  mag_3db_hz: 10.9-11.6
  phase_45_hz: 4.5-4.7
  phase_90_hz: 7.9-8.0
  mag_peak_db: 0.5-0.7      # 约 8 Hz
  vmax_dps: 555             # 速率限制，非线性
  step_rise_10_90_ms: 34-40 # 受速率限制，不是线性指标

# 200 Hz 发令（log12）时整台更快：−45° 5.6 Hz、总延迟约 1–2 ms，不止少半拍。换发令频率要重测。
